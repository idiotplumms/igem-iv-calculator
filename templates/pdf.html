<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover">

    <title>Engineer Briefing</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='main.css') }}">

    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}">

    <meta
        name="theme-color"
        content="#121a23">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <meta
        name="apple-mobile-web-app-title"
        content="IV Calculator">

    <link
        rel="apple-touch-icon"
        href="{{ url_for('static', filename='icon-180.png') }}">

</head>


<body>


    <div class="pdf-page">


        <div class="pdf-page-header">

            <h1>
                IGEM Engineer Briefing
            </h1>

        </div>


        <main class="pdf-launch-page">

            <section class="pdf-launch-card">

                <h2>
                    Engineer Briefing PDF
                </h2>

                <p>
                    Open the briefing document in your
                    device's PDF viewer for the best
                    reading and zooming experience.
                </p>

                <a
                    href="{{ url_for('briefing_pdf') }}"
                    class="pdf-launch-button">

                    Open PDF

                </a>

            </section>

        </main>


        <div class="pdf-page-back">

            <a
                href="{{ url_for('home') }}"
                class="pdf-back-button">

                ← Back to Briefing

            </a>

        </div>


    </div>


    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker.register(
                        "{{ url_for('service_worker') }}"
                    );

                }
            );

        }

    </script>


</body>

</html>
