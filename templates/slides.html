<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover">

    <title>IGEM IV Calculator</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='main.css') }}">

    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}">

    <meta
        name="theme-color"
        content="#121a23">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <meta
        name="apple-mobile-web-app-title"
        content="IV Calculator">

    <link
        rel="apple-touch-icon"
        href="{{ url_for('static', filename='icon-180.png') }}">

</head>


<body>

    <div class="slides-top-space"></div>

    <div class="navbar slides-top-nav">

        <a
            href="{{ url_for('calculator') }}"
            class="nav-button">

            Go to Calculator

        </a>

        <a
            href="{{ url_for('logout') }}"
            class="logout-button">

            Log Out

        </a>

    </div>

    <main class="page">


        <section class="intro">

            <h1>
                Engineer Briefing
            </h1>

            <p>
                Use the engineer briefing document
                as a reference.
            </p>

        </section>


        <section class="pdf-card">


            <div class="pdf-header">

                <h2>
                    IGEM Engineer Briefing
                </h2>

                <a
                    href="{{ url_for('pdf_viewer') }}"
                    class="open-pdf">

                    Open PDF

                </a>

            </div>


            <!-- PDF PREVIEW -->

            <div class="pdf-preview">

                <iframe
                    src="{{ url_for('briefing_pdf') }}"
                    title="IGEM Engineer Briefing PDF Preview">
                </iframe>

            </div>


            <div class="pdf-note">

                Tap <strong>Open PDF</strong> to view
                the full document.

                Use the
                <strong>← Back to Briefing</strong>
                button to return to this page.

            </div>


        </section>


    </main>


    <div class="navbar">


        <a
            class="nav-button"
            href="{{ url_for('calculator') }}">

            Go to Calculator

        </a>


        <a
            href="{{ url_for('logout') }}"
            class="logout-button">

            Log out

        </a>


    </div>


    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function () {

                    navigator.serviceWorker.register(
                        "{{ url_for('service_worker') }}"
                    );

                }
            );

        }

    </script>


</body>

</html>
